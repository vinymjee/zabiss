services:
  - type: web
    name: zabiss
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_DRIVER
        value: sqlite
      - key: DB_SQLITE_PATH
        value: /var/www/html/backend/zabiss.sqlite
      - key: APACHE_DOCUMENT_ROOT
        value: /var/www/html
