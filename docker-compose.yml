services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: zabiss_root
      MYSQL_DATABASE: zabiss
      MYSQL_USER: zabiss
      MYSQL_PASSWORD: zabiss_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/schema.v2.sql:/docker-entrypoint-initdb.d/02-schema-v2.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzabiss", "-pzabiss_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: zabiss
      DB_USER: zabiss
      DB_PASS: zabiss_secret
      DB_DRIVER: mysql
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
